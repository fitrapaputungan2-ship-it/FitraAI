name: Build Fitra AI APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Install Cordova
      run: npm install -g cordova
    - name: Create Cordova project
      run: |
        cordova create fitra-ai-app com.fitra.ai "Fitra AI"
        cd fitra-ai-app
        cordova platform add android
        cp ../index.html www/index.html
        cp ../style.css www/style.css
        cp ../script2.js www/script2.js
        sed -i 's/MASUKIN_API_KEY_DISINI/${{ secrets.GROQ_API_KEY }}/g' www/script2.js
    - name: Debug - List files
      run: |
        echo "=== current directory ==="
        pwd
        echo "=== Files in current directory ==="
        ls -la
        echo "=== Files in parent directory ==="
        ls -la ..
        echo "=== Search for icon.png ==="
        find / -name "icon.png" 2>/dev/null | head -5
    - name: Generate App Icon
      run: |
        cd fitra-ai-app
        npm install -g cordova-res
        mkdir -p resources
        cp../icon.png resources/icon.png
        cordova-res android --skip-config --copy
    - name: Build APK
      run: |
        cd fitra-ai-app
        cordova build android
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: fitra-ai-apk
        path: fitra-ai-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
 
